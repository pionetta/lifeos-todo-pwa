<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F5FFF"/>
      <stop offset="50%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#4ADEDE"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>

    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#roundedSquare)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Soft glass blobs for liquid-glass depth -->
    <circle cx="90" cy="80" r="150" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="440" cy="460" r="170" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="430" cy="70" r="90" fill="#FFFFFF" opacity="0.12"/>

    <!-- Glass panel behind card -->
    <rect x="96" y="86" width="320" height="340" rx="48" fill="url(#glassGrad)"/>
    <rect x="96" y="86" width="320" height="340" rx="48" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- Notebook / checklist card -->
  <g filter="url(#softShadow)">
    <rect x="128" y="118" width="256" height="276" rx="36" fill="url(#cardGrad)"/>
  </g>

  <!-- Spiral binding dots (diary feel) -->
  <g fill="#A78BFA" opacity="0.55">
    <circle cx="168" cy="118" r="7"/>
    <circle cx="168" cy="150" r="7"/>
    <circle cx="168" cy="182" r="7"/>
  </g>

  <!-- Checklist lines -->
  <g stroke="#94A3B8" stroke-width="10" stroke-linecap="round">
    <line x1="230" y1="180" x2="352" y2="180"/>
    <line x1="230" y1="232" x2="352" y2="232"/>
    <line x1="230" y1="284" x2="330" y2="284"/>
  </g>

  <!-- Checkbox squares -->
  <g>
    <rect x="192" y="166" width="26" height="26" rx="7" fill="none" stroke="#94A3B8" stroke-width="6"/>
    <rect x="192" y="270" width="26" height="26" rx="7" fill="none" stroke="#94A3B8" stroke-width="6"/>
  </g>

  <!-- Completed checkbox with checkmark (second item) -->
  <rect x="192" y="218" width="26" height="26" rx="7" fill="url(#checkGrad)"/>
  <path d="M197 231 L204 238 L216 222" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom accent: small heart/pen for diary touch -->
  <g transform="translate(300,330)">
    <circle r="34" fill="#FFFFFF" opacity="0.9"/>
    <path d="M-10,-6 C-10,-14 2,-14 0,-4 C2,-14 14,-14 14,-6 C14,2 0,14 0,14 C0,14 -10,2 -10,-6 Z"
          fill="#F472B6" transform="scale(0.9)"/>
  </g>
</svg>
